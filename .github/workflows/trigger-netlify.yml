name: netlify-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "bot deploy trigger $(date -u)" >> deploy-trigger.txt
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: trigger netlify build via github-actions bot"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
